<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3DStan — планировка цеха</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar d-flex align-items-center gap-2 px-3">
    <div class="brand me-3">3DStan</div>
    <input id="layoutName" class="form-control form-control-sm layout-name" value="Основной цех" aria-label="Название планировки">
    <button id="saveBtn" class="btn btn-primary btn-sm">Сохранить</button>
    <button id="loadBtn" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#layoutsModal">Планировки</button>
    <button id="topViewBtn" class="btn btn-outline-light btn-sm">Вид сверху</button>
    <button id="isoViewBtn" class="btn btn-outline-light btn-sm">3D вид</button>
    <span class="ms-auto small text-white-50" id="statusText">Готово</span>
  </header>

  <main class="workspace">
    <aside class="left-panel panel">
      <div class="panel-title">Инструменты</div>
      <div class="p-2 d-grid gap-2">
        <button class="btn btn-sm btn-outline-primary tool-btn active" data-tool="select">Выбор / перемещение</button>
        <button class="btn btn-sm btn-outline-secondary tool-btn" data-tool="wall">Нарисовать стену</button>
        <button class="btn btn-sm btn-outline-secondary tool-btn" data-tool="door">Добавить дверь</button>
        <button id="deleteBtn" class="btn btn-sm btn-outline-danger">Удалить выбранное</button>
      </div>

      <div class="panel-title border-top">Свойства объекта</div>
      <div id="propertiesPanel" class="p-2 small text-secondary">
        Выберите объект на сцене.
      </div>
    </aside>

    <section id="viewportWrap" class="viewport-wrap">
      <canvas id="threeCanvas"></canvas>
      <div class="viewport-help">
        ЛКМ — выбор · перетаскивание — перемещение · колесо — масштаб · ПКМ — вращение камеры
      </div>
      <div id="selectionBadge" class="selection-badge d-none"></div>
    </section>

    <aside class="right-panel panel">
      <div class="panel-title d-flex align-items-center justify-content-between">
        <span>База оборудования</span>
        <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#equipmentModal">+</button>
      </div>
      <div class="p-2">
        <input id="equipmentSearch" class="form-control form-control-sm mb-2" placeholder="Поиск станка...">
        <div id="equipmentTree" class="equipment-tree"></div>
      </div>
      <div class="panel-title border-top">Объекты на плане</div>
      <div id="sceneTree" class="scene-tree p-2"></div>
    </aside>
  </main>
</div>

<div class="modal fade" id="layoutsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Сохранённые планировки</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div id="layoutsList" class="list-group"></div></div>
    </div>
  </div>
</div>

<div class="modal fade" id="equipmentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="equipmentForm">
        <div class="modal-header"><h5 class="modal-title">Новое оборудование</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Название</label><input name="name" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Категория</label><input name="category" class="form-control" value="Прочее"></div>
          <div class="row g-2">
            <div class="col"><label class="form-label">Ширина, м</label><input name="width" type="number" step="0.1" class="form-control" value="1"></div>
            <div class="col"><label class="form-label">Глубина, м</label><input name="depth" type="number" step="0.1" class="form-control" value="1"></div>
            <div class="col"><label class="form-label">Высота, м</label><input name="height" type="number" step="0.1" class="form-control" value="1"></div>
          </div>
          <div class="mt-2"><label class="form-label">Цвет</label><input name="color" type="color" class="form-control form-control-color" value="#4472c4"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" type="submit">Добавить в базу</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
