name: Fix and validate editor

on:
  push:
    paths:
      - '.github/workflows/fix-editor.yml'

permissions:
  contents: write

jobs:
  fix-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix compact ternary expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/js/app.js')
          s = p.read_text(encoding='utf-8')
          old = "opacity:['passage','zone','techZone','dangerZone'].includes(kind)?.32:kind==='window'?.55:1"
          new = "opacity:['passage','zone','techZone','dangerZone'].includes(kind) ? .32 : (kind==='window' ? .55 : 1)"
          if old not in s:
              raise SystemExit('Expected expression not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: node --check static/js/app.js
      - name: Commit validated editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/app.js
          git commit -m "Fix editor JavaScript syntax"
          git push
